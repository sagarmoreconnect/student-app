<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student App</title>
  <style>
    body { font-family: Arial; max-width: 700px; margin: 30px auto; }
    input { padding: 8px; margin: 4px; }
    button { padding: 8px 14px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <h2>Student Management</h2>

  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">
  <input id="course" placeholder="Course">
  <button onclick="addStudent()">Add</button>

  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th></tr></thead>
    <tbody id="list"></tbody>
  </table>

  <script>
    async function load() {
      const res = await fetch('/api/students');
      const data = await res.json();
      document.getElementById('list').innerHTML = data.map(s =>
        `<tr><td>${s.id}</td><td>${s.name}</td><td>${s.email}</td><td>${s.course}</td></tr>`
      ).join('');
    }

    async function addStudent() {
      const student = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        course: document.getElementById('course').value
      };
      await fetch('/api/students', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(student)
      });
      load();
    }

    load();
  </script>
</body>
</html>
